name: Deploy Built Stage
on:
  push:
    branches: [ main ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get or Make Stage ID
        id: get_stage_id
        run: |
          if [ ! -f .stage_id ]; then
            RESPONSE=$(curl -s -X POST "https://chub.ai" \
              -H "Authorization: Bearer ${{ secrets.CHUB_AUTH_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name": "Konrad Tactical HUD", "description": "HUD de Overlord para Konrad", "is_public": false}')
            STAGE_ID=$(echo $RESPONSE | jq -r '.id // .stage_id // empty')
            echo "STAGE_ID=$STAGE_ID" >> $GITHUB_ENV
            echo "Response: $RESPONSE"
          fi

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Zip the build folder
        run: cd dist && zip -r ../build.zip .

      - name: Upload the build
        run: |
          curl -v -X POST "https://chub.ai/upload" \
            -H "Authorization: Bearer ${{ secrets.CHUB_AUTH_TOKEN }}" \
            -F "file=@build.zip"

